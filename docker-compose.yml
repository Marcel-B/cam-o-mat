# cam-o-mat: Tailscale + go2rtc + Caddy
# Alle drei Container teilen sich das Netzwerk des Tailscale-Containers.
# Erreichbar ist die Seite NUR im Tailnet: https://cam-o-mat.<dein-tailnet>.ts.net
# Die Images baut GitHub Actions (ghcr.io); "docker compose up -d --build" baut sie stattdessen hier.
# Die Kameras stehen in kameras.conf (./kameras.sh oder "Kamera hinzufügen" auf der Seite), daraus entsteht generated/.
services:
  tailscale:
    image: tailscale/tailscale:latest
    hostname: ${TS_HOSTNAME:-cam-o-mat}
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - ./tailscale-state:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    restart: unless-stopped

  go2rtc:
    image: ghcr.io/marcel-b/cam-o-mat-go2rtc:latest
    build:
      context: .
      dockerfile: docker/go2rtc/Dockerfile
    network_mode: service:tailscale
    volumes:
      - ./generated:/config/generated:ro
    restart: unless-stopped

  web:
    image: ghcr.io/marcel-b/cam-o-mat-web:latest
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    network_mode: service:tailscale
    restart: unless-stopped

  # Trägt Kameras ein ("Kamera hinzufügen" auf der Seite) und schaltet das Licht. Selbes Image wie go2rtc.
  verwaltung:
    image: ghcr.io/marcel-b/cam-o-mat-go2rtc:latest
    command: ["python3", "-u", "/app/verwaltung.py"]
    network_mode: service:tailscale
    environment:
      - CAM_BASIC_AUTH=${CAM_BASIC_AUTH:-}
    volumes:
      # kameras.conf muss es geben (kameras.sh legt sie an), sonst würde Docker ein Verzeichnis daraus machen
      - type: bind
        source: ./kameras.conf
        target: /data/kameras.conf
        bind:
          create_host_path: false
      - ./generated:/data/generated
    restart: unless-stopped
