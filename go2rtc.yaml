# go2rtc holt den Stream nur, solange jemand zuschaut, und verteilt ihn an alle Zuschauer.
streams:
  hund: http://192.168.2.134/stream.mjpg
  # wohnzimmer: http://192.168.2.135/stream.mjpg

api:
