# Grundeinstellungen von go2rtc. Die Kameras stehen nicht hier, sondern in kameras.conf;
# kameras.sh macht daraus generated/kameras.yaml, die go2rtc zusätzlich lädt.
# Gestreamt wird über esp-mjpeg.sh, weil go2rtc den Stream der Prusa-Firmware direkt nicht versteht
# (fehlende Boundary vor dem ersten Bild). go2rtc holt den Stream nur, solange jemand zuschaut.

api:
  listen: "127.0.0.1:1984"   # nur intern, Caddy reicht die nötigen Pfade weiter

# nicht benötigte Dienste aus
rtsp:
  listen: ""
webrtc:
  listen: ""
srtp:
  listen: ""
rtmp:
  listen: ""

log:
  level: info
